<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - CampusFix AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <h1>Analytics</h1>
        <p class="page-sub">See which buildings and categories have the most issues and how fast they are resolved.</p>

        <div class="stat-grid" id="summaryGrid"></div>

        <div class="chart-error" id="chartError" hidden>
          Charts could not load. Please check your internet connection and refresh the page.
        </div>

        <div class="chart-grid">
          <div class="card">
            <h3 class="card-title">Issues by Building</h3>
            <div class="chart-box"><canvas id="buildingChart"></canvas></div>
          </div>
          <div class="card">
            <h3 class="card-title">Issues by Category</h3>
            <div class="chart-box"><canvas id="categoryChart"></canvas></div>
          </div>
          <div class="card">
            <h3 class="card-title">Issues by Priority</h3>
            <div class="chart-box"><canvas id="priorityChart"></canvas></div>
          </div>
          <div class="card">
            <h3 class="card-title">Issues by Status</h3>
            <div class="chart-box"><canvas id="statusChart"></canvas></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../js/seed.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/analytics.js"></script>
</body>
</html>
